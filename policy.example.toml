# Dozor policy — the only human-authored input. Lives in git, reviewed in a PR.
version = 1

[defaults]
# Severity gate for CVE-style advisories: critical | high | moderate | low | off
severity_threshold = "high"

# MAL-* reports (malicious packages) carry no severity at all — 96.8% of the
# npm OSV feed is these. They get their own switch: block | audit
malicious = "block"

# Closed by default: the two settings below block the most when left out.
# Writing them blocks less, and the line is the record of who decided that.
#
# proactive = false
#   only malicious packages the inventory holds; by default every wholly-malicious
#   package in the feed is blocked before its first download.
#
# malicious_versions = "cached"
#   only the malicious versions the inventory holds; by default every version a
#   malicious report lists is blocked for a package you hold, so a release the
#   registry has not downloaded yet (held back by min_release_age, say) is covered.
#
# A value or a key Dozor does not know fails the build (exit 5).

# Every exception needs a reason and an expiry date. An expired exception
# fails the build (exit 4) instead of quietly renewing itself.
# [[exception]]
# registry = "npm"
# name = "lodash"
# version = "4.17.20"
# reason = "pinned by legacy build, tracked in JIRA-42"
# expires = "2026-12-31"
