name: publish-crates

# Publishes the workspace to crates.io in dependency order.
#
# Needs a CARGO_REGISTRY_TOKEN repository secret. Without it the job still runs
# and does a full dry run, so a missing token is a visible skip rather than a
# silent one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set — dry run only"
            DRY=true
          fi

          # dozor-vers <- dozor-osv <- dozor-core <- dozor
          deps_of() {
            case "$1" in
              dozor-vers) echo "" ;;
              dozor-osv)  echo "dozor-vers" ;;
              dozor-core) echo "dozor-vers dozor-osv" ;;
              dozor)      echo "dozor-vers dozor-osv dozor-core" ;;
            esac
          }
          published() { cargo info "$1@$VERSION" >/dev/null 2>&1; }

          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "publishing version $VERSION"

          for crate in dozor-vers dozor-osv dozor-core dozor; do
            echo "::group::$crate"

            if published "$crate"; then
              echo "$crate $VERSION is already on crates.io — nothing to do"
              echo "::endgroup::"; continue
            fi

            # A crate cannot even be packaged until its path dependencies are
            # resolvable from the registry, so an unpublished dependency is a
            # skip with a reason, never a red build.
            blocked=""
            for dep in $(deps_of "$crate"); do
              published "$dep" || blocked="$blocked $dep"
            done
            if [ -n "$blocked" ]; then
              echo "::notice::$crate skipped — waiting on:$blocked"
              echo "::endgroup::"; continue
            fi

            if [ "$DRY" = "true" ]; then
              ( cd "crates/$crate" && cargo publish --dry-run )
            else
              ( cd "crates/$crate" && cargo publish )
              # The index needs a moment before the next crate can resolve it.
              for i in $(seq 30); do published "$crate" && break; sleep 10; done
            fi
            echo "::endgroup::"
          done

          echo "### crates.io" >> "$GITHUB_STEP_SUMMARY"
          for crate in dozor-vers dozor-osv dozor-core dozor; do
            if published "$crate"; then s="published $VERSION"; else s="not published"; fi
            echo "- \`$crate\` — $s" >> "$GITHUB_STEP_SUMMARY"
          done
