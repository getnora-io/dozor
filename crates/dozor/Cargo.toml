[package]
name = "dozor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["osv", "registry", "blocklist", "supply-chain", "nora"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
description = "Dozor — the watch at the mouth of the burrow. Compiles OSV + registry inventory into a NORA blocklist."

[[bin]]
name = "dozor"
path = "src/main.rs"

[dependencies]
dozor-core = { path = "../dozor-core", version = "0.1.0" }
dozor-osv = { path = "../dozor-osv", version = "0.1.0" }
dozor-vers = { path = "../dozor-vers", version = "0.1.0" }
clap = { workspace = true }
serde_json = { workspace = true }
